services:
  postgres:
    image: postgres:17
    container_name: investhub-postgres
    environment:
      POSTGRES_DB: investhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - investhub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: investhub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: investhub
      RABBITMQ_DEFAULT_PASS: investhub_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  investhub_data:
  rabbitmq_data: